<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>納品登録 | 大阪テック</title>
<style>
  :root {
    --blue: #1d4ed8; --blue-dark: #1e40af;
    --green: #059669; --green-dark: #047857; --green-bg: #ecfdf5; --green-bd: #a7f3d0;
    --ink: #1e293b; --sub: #64748b; --line: #e2e8f0; --bg: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
  body { -webkit-tap-highlight-color: transparent; padding-bottom: 40px; }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ---- ヘッダー ---- */
  .app-header { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .app-title { font-size: 16px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .app-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .logout-btn { border: none; background: none; color: var(--sub); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 4px; }

  /* ---- ログイン画面 ---- */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 340px; background: #fff; border-radius: 16px; padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(15,23,42,.08); }
  .login-card h1 { font-size: 18px; font-weight: 800; text-align: center; margin: 0 0 4px; }
  .login-card p.sub { text-align: center; color: var(--sub); font-size: 12.5px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 10px;
    background: #f8fafc; }
  .field input:focus { outline: none; border-color: var(--blue); background: #fff; }
  .login-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 800; color: #fff; background: var(--blue);
    border: none; border-radius: 10px; margin-top: 6px; cursor: pointer; }
  .login-btn:active { background: var(--blue-dark); }
  .login-btn:disabled { opacity: .6; }
  .login-err { margin-top: 12px; padding: 10px 12px; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
    border-radius: 8px; font-size: 12.5px; display: none; }
  .login-err.show { display: block; }
  .denied { text-align: center; padding: 60px 24px; color: var(--sub); }

  /* ---- 仕入先グリッド ---- */
  .toolbar { padding: 12px 16px 0; }
  .search-input { width: 100%; padding: 11px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 10px;
    background: #fff; }
  .summary-bar { padding: 10px 16px 4px; font-size: 12px; color: var(--sub); }

  .sup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 12px 24px; }
  .sup-btn { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 8px; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .sup-btn:active { background: #f8fafc; }
  .sup-logo { height: 32px; max-width: 100%; object-fit: contain; margin: 0 auto 6px; display: block; }
  .sup-name { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.3; word-break: break-word; }
  .sup-badge { position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px;
    background: linear-gradient(155deg,#60a5fa,var(--blue) 60%,var(--blue-dark)); color: #fff; font-size: 11px;
    font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(29,78,216,.35); }

  /* ---- 仕入先詳細（品目フラットリスト） ---- */
  .detail-header { padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .back-btn { border: 1px solid #cbd5e1; background: #fff; color: var(--sub); font-size: 12.5px; font-weight: 700;
    padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .detail-company { font-size: 15px; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; }

  .item-card { background: #fff; margin: 0 12px 10px; border-radius: 12px; border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.03); padding: 13px 14px; }
  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .item-date { font-size: 10.5px; font-weight: 700; color: var(--blue); background: #eff6ff; border: 1px solid #bfdbfe;
    border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .item-requester { font-size: 11px; color: var(--sub); }
  .item-name { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .item-sub { font-size: 11.5px; color: var(--sub); margin-bottom: 10px; }
  .item-inputs { display: flex; align-items: flex-end; gap: 8px; }
  .item-inputs .grp { flex: 1; }
  .item-inputs label { display: block; font-size: 10.5px; color: var(--sub); margin-bottom: 3px; }
  .item-inputs input { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .item-inputs .amount-disp { font-size: 12.5px; font-weight: 700; color: var(--green-dark); text-align: right;
    min-width: 64px; }
  .deliver-btn { border: none; background: var(--green); color: #fff; font-size: 12.5px; font-weight: 800;
    padding: 10px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .deliver-btn:active { background: var(--green-dark); }
  .deliver-btn:disabled { opacity: .5; }

  .empty { text-align: center; color: #94a3b8; padding: 60px 24px; font-size: 13.5px; }
  .loading { text-align: center; color: #94a3b8; padding: 40px; font-size: 13px; }

  /* ---- トースト ---- */
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #1e293b; color: #fff; font-size: 13px; font-weight: 700; padding: 11px 20px; border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,.2); transition: all .2s; z-index: 100; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>📦 納品登録</h1>
    <p class="sub">大阪テック 発注管理</p>
    <div class="field">
      <label>ユーザーID</label>
      <input id="login-userid" type="text" autocomplete="username" inputmode="text">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input id="login-password" type="password" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <div class="wrap">
    <div class="app-header">
      <div class="app-title"><span class="dot"></span>納品登録</div>
      <div class="user-chip">
        <span id="user-name-label"></span>
        <button class="logout-btn" onclick="doLogout()">ログアウト</button>
      </div>
    </div>

    <!-- 仕入先グリッド画面 -->
    <div id="supplier-screen">
      <div class="toolbar">
        <input class="search-input" id="search-input" type="text" placeholder="仕入先で検索" oninput="renderSupplierGrid()">
      </div>
      <div class="summary-bar" id="summary-bar"></div>
      <div id="supplier-root"></div>
    </div>

    <!-- 仕入先別 品目リスト画面 -->
    <div id="detail-screen" style="display:none;">
      <div class="detail-header">
        <button class="back-btn" onclick="showSupplierScreen()">← 仕入先一覧</button>
        <div class="detail-company" id="detail-company-label"></div>
      </div>
      <div id="detail-root"></div>
    </div>
  </div>
</div>

<div id="denied-screen" style="display:none;">
  <div class="wrap">
    <div class="app-header">
      <div class="app-title"><span class="dot"></span>納品登録</div>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
    <div class="denied">このアカウントには納品登録の利用権限がありません。<br>永冨・山下、または担当権限を持つ方にご確認ください。</div>
  </div>
</div>

<div id="toast"></div>

function supplierBadgeHtml(name) {
  const ch = (name || '?').replace(/株式会社|有限会社/g, '').charAt(0) || '?';
  const hue = Array.from(name || '').reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return '<div class="sup-logo" style="height:32px;width:32px;border-radius:50%;margin:0 auto 6px;'
    + 'display:flex;align-items:center;justify-content:center;background:hsl(' + hue + ',55%,45%);color:#fff;font-weight:800;font-size:13px;">'
    + esc(ch) + '</div>';
}
function logoFallback(imgEl, company) {
  const div = document.createElement('div');
  div.innerHTML = supplierBadgeHtml(company);
  imgEl.replaceWith(div.firstElementChild);
}

let currentUser = null;
let _requests = [];        // purchase_requests（ordered分に関連するもの）
let _reqItems = new Map(); // request_id -> items[]
let _itemsById = new Map(); // purchase_items.id -> master row
let _selectedCompany = null;

// ---- 汎用: ページングして全件取得 ----
async function fetchAll(url) {
  const PAGE = 1000;
  let all = [], offset = 0;
  while (true) {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'limit=' + PAGE + '&offset=' + offset, { headers: H() });
    if (!res.ok) break;
    const rows = await res.json();
    all = all.concat(rows);
    if (rows.length < PAGE) break;
    offset += PAGE;
  }
  return all;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function normalizeSearch(s) { return String(s || '').toLowerCase(); }

function toast(msg, color) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = color || '#1e293b';
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function toJstDate(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  if (isNaN(d.getTime())) return '';
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}
function fmtDate(dateKey) {
  if (!dateKey) return '（日付不明）';
  const d = new Date(dateKey + 'T00:00:00');
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return dateKey.replace(/-/g, '/') + '（' + w + '）';
}

// ---- 権限判定: 本体アプリと同じ基準（perm_requests_view、または永冨・山下） ----
function canUseThisApp(user) {
  if (!user) return false;
  if (user.perm_requests_view != null) return !!user.perm_requests_view;
  const name = (user.loginname || '') + '|' + (user.userid || '');
  return name.includes('永冨') || name.includes('山下')
    || name.toLowerCase().includes('nagatomi') || name.toLowerCase().includes('yamashita');
}

// ---- ログイン ----
async function doLogin() {
  const userid = document.getElementById('login-userid').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errBox = document.getElementById('login-err');
  errBox.classList.remove('show');

  if (!userid || !password) {
    errBox.textContent = 'ユーザーIDとパスワードを入力してください';
    errBox.classList.add('show');
    return;
  }
  btn.disabled = true;
  btn.textContent = '確認中...';
  try {
    const url = SUPABASE_URL + '/rest/v1/loginuser?select=id,userid,loginname,department,password,factory,perm_requests_view&userid=eq.' + encodeURIComponent(userid);
    const res = await fetch(url, { headers: H() });
    if (!res.ok) throw new Error('通信エラー (HTTP ' + res.status + ')');
    const rows = await res.json();
    if (rows.length === 0 || rows[0].password !== password) {
      errBox.textContent = 'ユーザーIDまたはパスワードが正しくありません';
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'ログイン';
      return;
    }
    currentUser = rows[0];
    document.getElementById('login-screen').style.display = 'none';

    if (!canUseThisApp(currentUser)) {
      document.getElementById('denied-screen').style.display = '';
      return;
    }
    document.getElementById('main-screen').style.display = '';
    document.getElementById('user-name-label').textContent = (currentUser.loginname || currentUser.userid) + (currentUser.department ? '（' + currentUser.department + '）' : '');
    await loadData();
  } catch (e) {
    errBox.textContent = e.message || '通信に失敗しました';
    errBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
}

function doLogout() {
  currentUser = null;
  _requests = []; _reqItems = new Map(); _selectedCompany = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('denied-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = '';
  document.getElementById('login-userid').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-btn').textContent = 'ログイン';
  document.getElementById('login-err').classList.remove('show');
}

// ---- データ読み込み: 発注完了(ordered)の品目のみ対象 ----
async function loadData() {
  document.getElementById('supplier-root').innerHTML = '<div class="loading">読み込み中...</div>';

  const items = await fetchAll(`${SUPABASE_URL}/rest/v1/purchase_request_items?select=*&status=eq.ordered&order=id.asc`);
  const reqIds = [...new Set(items.map(it => it.request_id))];
  _requests = [];
  if (reqIds.length) {
    for (let i = 0; i < reqIds.length; i += 150) {
      const chunk = reqIds.slice(i, i + 150);
      const rows = await fetchAll(`${SUPABASE_URL}/rest/v1/purchase_requests?select=id,requested_by,created_at&id=in.(${chunk.join(',')})`);
      _requests = _requests.concat(rows);
    }
  }
  _reqItems = new Map();
  items.forEach(it => {
    if (!_reqItems.has(it.request_id)) _reqItems.set(it.request_id, []);
    _reqItems.get(it.request_id).push(it);
  });

  // 物品マスタ（単価デフォルト取得用）
  const masterIds = [...new Set(items.map(it => it.item_id).filter(id => id != null))];
  _itemsById = new Map();
  if (masterIds.length) {
    for (let i = 0; i < masterIds.length; i += 150) {
      const chunk = masterIds.slice(i, i + 150);
      const rows = await fetchAll(`${SUPABASE_URL}/rest/v1/purchase_items?select=id,unit_price&id=in.(${chunk.join(',')})`);
      rows.forEach(r => _itemsById.set(r.id, r));
    }
  }

  renderSupplierGrid();
}

// request_id -> requester/date でジョインした「発注完了」品目のフラットな配列を返す
function flatOrderedItems() {
  const reqById = new Map(_requests.map(r => [r.id, r]));
  const list = [];
  _reqItems.forEach((items, reqId) => {
    const r = reqById.get(reqId);
    if (!r) return;
    items.forEach(it => list.push({ it, requester: r.requested_by, date: toJstDate(r.created_at), created_at: r.created_at }));
  });
  return list;
}

function supplierCounts() {
  const counts = new Map();
  flatOrderedItems().forEach(({ it }) => {
    const c = it.company || '（仕入先未設定）';
    counts.set(c, (counts.get(c) || 0) + 1);
  });
  return counts;
}

// ---- 仕入先グリッド画面 ----
function renderSupplierGrid() {
  const q = normalizeSearch(document.getElementById('search-input')?.value || '').trim();
  const counts = supplierCounts();
  const companies = [...counts.keys()]
    .filter(c => !q || normalizeSearch(c).includes(q))
    .sort((a, b) => (counts.get(b) - counts.get(a)) || a.localeCompare(b, 'ja'));

  const root = document.getElementById('supplier-root');
  const summary = document.getElementById('summary-bar');
  const totalItems = [...counts.values()].reduce((s, n) => s + n, 0);
  summary.textContent = counts.size ? (counts.size + '社・計' + totalItems + '品目が納品待ちです') : '';

  if (!companies.length) {
    root.innerHTML = '<div class="empty">' + (q ? '該当する仕入先が見つかりません' : '納品待ちの発注はありません') + '</div>';
    return;
  }

  root.innerHTML = '<div class="sup-grid">' + companies.map(c => {
    const n = counts.get(c) || 0;
    const logo = PU_SUPPLIER_LOGO[c]
      ? '<img class="sup-logo" src="' + PU_SUPPLIER_LOGO[c] + '" alt="" onerror="logoFallback(this,\'' + c.replace(/'/g, "\\'") + '\')">'
      : supplierBadgeHtml(c);
    return '<div class="sup-btn" onclick="selectSupplier(\'' + c.replace(/'/g, "\\'") + '\')">'
      + (n ? '<span class="sup-badge">' + n + '</span>' : '')
      + logo
      + '<div class="sup-name">' + esc(c) + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

function selectSupplier(company) {
  _selectedCompany = company;
  document.getElementById('supplier-screen').style.display = 'none';
  document.getElementById('detail-screen').style.display = '';
  document.getElementById('detail-company-label').textContent = company;
  renderDetail();
}

function showSupplierScreen() {
  _selectedCompany = null;
  document.getElementById('detail-screen').style.display = 'none';
  document.getElementById('supplier-screen').style.display = '';
  renderSupplierGrid();
}

// ---- 仕入先詳細: 発注完了データのフラットな一覧（依頼履歴のデータリストと同じ考え方） ----
function renderDetail() {
  const root = document.getElementById('detail-root');
  const rows = flatOrderedItems()
    .filter(row => (row.it.company || '（仕入先未設定）') === _selectedCompany)
    .sort((a, b) => b.created_at.localeCompare(a.created_at));

  if (!rows.length) {
    root.innerHTML = '<div class="empty">この仕入先の納品待ちデータはありません</div>';
    return;
  }

  root.innerHTML = rows.map(row => buildItemCardHtml(row)).join('');
}

function buildItemCardHtml(row) {
  const it = row.it;
  const master = it.item_id != null ? _itemsById.get(it.item_id) : null;
  const defPrice = (master && master.unit_price != null) ? master.unit_price : '';
  const qty = it.qty || 0;
  const rowId = 'row-' + it.id;
  return '<div class="item-card" id="' + rowId + '" data-item-id="' + it.id + '" data-qty="' + qty + '">'
    + '<div class="item-top">'
      + '<span class="item-date">' + esc(fmtDate(row.date)) + '</span>'
      + '<span class="item-requester">' + esc(row.requester) + '様</span>'
    + '</div>'
    + '<div class="item-name">' + esc(it.product_name) + '</div>'
    + '<div class="item-sub">入数: ' + (it.amount != null ? it.amount + esc(it.unit || '') : esc(it.unit || '')) + '　注文数: ' + qty + (it.box ? '　荷姿: ' + esc(it.box) : '') + '　宛先: ' + esc(it.destination || '') + '</div>'
    + '<div class="item-inputs">'
      + '<div class="grp"><label>単価（円）</label>'
        + '<input type="number" min="0" step="1" class="price-input" value="' + defPrice + '" oninput="onPriceInput(\'' + rowId + '\')"></div>'
      + '<div class="amount-disp" data-role="amount">' + (defPrice !== '' ? Math.round(defPrice * qty).toLocaleString() + '円' : '-') + '</div>'
      + '<button class="deliver-btn" onclick="deliverItem(\'' + rowId + '\')">納品済み</button>'
    + '</div>'
  + '</div>';
}

function onPriceInput(rowId) {
  const card = document.getElementById(rowId);
  if (!card) return;
  const qty = parseFloat(card.dataset.qty) || 0;
  const priceInput = card.querySelector('.price-input');
  const price = priceInput.value.trim() === '' ? null : parseFloat(priceInput.value);
  const amountEl = card.querySelector('[data-role="amount"]');
  amountEl.textContent = (price != null && !isNaN(price)) ? Math.round(price * qty).toLocaleString() + '円' : '-';
}

async function deliverItem(rowId) {
  const card = document.getElementById(rowId);
  if (!card) return;
  const itemId = Number(card.dataset.itemId);
  const qty = parseFloat(card.dataset.qty) || 0;
  const priceInput = card.querySelector('.price-input');
  const price = priceInput.value.trim() === '' ? null : parseFloat(priceInput.value);
  const lineAmount = (price != null && !isNaN(price)) ? Math.round(price * qty) : null;
  const name = card.querySelector('.item-name').textContent;

  if (!confirm('「' + name + '」を納品済みとして登録します。よろしいですか？')) return;

  const btn = card.querySelector('.deliver-btn');
  btn.disabled = true;
  btn.textContent = '登録中';

  const nowIso = new Date().toISOString();
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/purchase_request_items?id=eq.${itemId}`, {
      method: 'PATCH', headers: { ...H(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: 'delivered', delivered_at: nowIso, unit_price: price, line_amount: lineAmount })
    });
    if (!res.ok) throw new Error(await res.text());
    toast('📦 納品済みにしました', '#059669');
    await loadData();
    if (_selectedCompany) {
      document.getElementById('supplier-screen').style.display = 'none';
      document.getElementById('detail-screen').style.display = '';
      renderDetail();
    }
  } catch (e) {
    alert('登録に失敗しました: ' + e.message);
    btn.disabled = false;
    btn.textContent = '納品済み';
  }
}
</script>
